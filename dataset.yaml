# ==============================================================================
# YOLO11s 迁移训练数据集配置（9 种食材）
#
# 推荐目录结构（datasets/ 已在 .gitignore 中忽略，不会提交到 git）：
#   datasets/
#   ├── images/
#   │   ├── train/   # 训练集图片（.jpg / .jpeg / .png / .bmp / .webp）
#   │   └── val/     # 验证集图片
#   └── labels/
#       ├── train/   # 训练集 YOLO 标签 .txt（每行: class_id cx cy w h）
#       └── val/     # 验证集 YOLO 标签 .txt
#
# 使用说明：
#   1. 默认相对本 YAML 所在目录解析 datasets/；若数据集在仓库外部，
#      可取消下方 path 注释填写绝对路径，并将 train / val 改为 images/train、images/val。
#   2. 请将下方 names 替换为实际的 9 种食材名称，
#      编号 0~8 必须与标签 .txt 中的 class_id 严格一一对应。
# ==============================================================================

# path: /absolute/path/to/datasets
train: datasets/images/train
val: datasets/images/val

nc: 9
names:
  0: class_0
  1: class_1
  2: class_2
  3: class_3
  4: class_4
  5: class_5
  6: class_6
  7: class_7
  8: class_8
